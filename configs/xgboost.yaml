# xgboost.yaml — XGBoost-specific hyperparameters
# ห้าม hardcode ค่าเหล่านี้ในโค้ด .py โดยตรง

model:
  name: xgboost
  version: 1

params:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.01
  reg_lambda: 1.0
  objective: reg:squarederror
  eval_metric: rmse
  early_stopping_rounds: 30
  verbosity: 1

optuna:
  n_trials: 50
  timeout: 3600  # 1 hour
  direction: minimize
  metric: rmse
  search_space:
    max_depth: [3, 10]
    learning_rate: [0.01, 0.3]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
    min_child_weight: [1, 10]
    n_estimators: [100, 500]
